<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tiếp nhận bảo hành</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><h1>Tiếp nhận và phân loại yêu cầu bảo hành</h1><p>Prototype L2 · Sprint 1</p></header>
<section class="panel"><h2>1. Tra cứu khách hàng</h2><form id="customer-search-form"><input name="phone" placeholder="Số điện thoại 10–11 số" required><button>Tra cứu</button></form><p id="customer-search-msg" role="status"></p><pre id="customer-result"></pre><h3>Tạo hồ sơ khách hàng</h3><form id="customer-form"><input name="full_name" placeholder="Họ tên" required><input name="phone" placeholder="Số điện thoại 10–11 số" required><input name="email" placeholder="Email (không bắt buộc)"><button>Tạo khách hàng</button></form><p id="customer-msg" role="status"></p><button id="load-customers" class="secondary">Tải danh sách khách hàng</button><pre id="customers"></pre></section>
<section class="panel"><h2>2. Tạo phiếu bảo hành</h2><p class="hint">Dữ liệu demo: khách hàng 1, thiết bị 1, nhóm lỗi 1. Thiết bị demo 2 đã hết hạn bảo hành.</p><form id="ticket-form"><input name="customer_id" type="number" min="1" placeholder="Mã khách hàng" required><input name="device_id" type="number" min="1" placeholder="Mã thiết bị" required><input name="category_id" type="number" min="1" placeholder="Mã nhóm lỗi" required><select name="priority"><option value="TRUNG_BINH">Trung bình</option><option value="CAO">Cao</option><option value="THAP">Thấp</option></select><textarea name="issue_desc" minlength="10" placeholder="Mô tả lỗi (ít nhất 10 ký tự)" required></textarea><button>Tạo phiếu</button></form><p id="ticket-msg" role="status"></p></section>
<section class="panel"><h2>3. Danh sách phiếu</h2><button id="load-tickets" class="secondary">Tải danh sách phiếu</button><pre id="tickets"></pre></section><footer>BT2 · L2 · SQLite prototype · API JSON</footer></main><script src="/static/app.js"></script></body></html>
