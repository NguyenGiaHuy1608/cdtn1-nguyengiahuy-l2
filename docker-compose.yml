services:
  warranty-app:
    build: .
    container_name: warranty-container
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s